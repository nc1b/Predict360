name: Desktop app (macOS)


on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm ci --prefix ..
          npm ci

      - name: Build the macOS app
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify the app signature
        run: |
          APP="$(ls -d release/mac*/*.app | head -1)"
          echo "Checking $APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | grep -E "Signature|Identifier|Format"

      - name: Upload the macOS build
        uses: actions/upload-artifact@v4
        with:
          name: predict360-macos
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
          if-no-files-found: error

      - name: Publish the Mac app to a GitHub Release (tagged builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/release/Predict360-macOS.dmg
