name: Desktop app (Windows)


on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      SIGNING_CONFIGURED: ${{ secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_SIGNING_PROFILE != '' }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          npm ci --prefix ..
          npm ci

      # Unsigned builds trigger Microsoft Defender SmartScreen ("Windows protected your PC").
      # Add the Azure Trusted Signing secrets below to sign the installer and the app.
      - name: Build the Windows installer (unsigned)
        if: env.SIGNING_CONFIGURED != 'true'
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Build and sign the Windows installer (Azure Trusted Signing)
        if: env.SIGNING_CONFIGURED == 'true'
        shell: bash
        run: >
          npm run dist --
          -c.win.azureSignOptions.publisherName="$AZURE_SIGNING_PUBLISHER"
          -c.win.azureSignOptions.endpoint="$AZURE_SIGNING_ENDPOINT"
          -c.win.azureSignOptions.codeSigningAccountName="$AZURE_SIGNING_ACCOUNT"
          -c.win.azureSignOptions.certificateProfileName="$AZURE_SIGNING_PROFILE"
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_PUBLISHER: ${{ secrets.AZURE_SIGNING_PUBLISHER }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}

      - name: Upload the .exe as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: predict360-windows
          path: desktop/release/*.exe
          if-no-files-found: error

      - name: Publish to Supabase Storage
        run: node ../scripts/publish-desktop.js
