name: Desktop app (Windows)

# Build an installer with the website icon, then publish directly to Supabase.
# OIDC authorizes publishing without a stored Supabase service key.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          npm ci --prefix ..
          npm ci

      - name: Build the Windows installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload the .exe as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: predict360-windows
          path: desktop/release/*.exe
          if-no-files-found: error

      - name: Publish to Supabase Storage
        run: node ../scripts/publish-desktop.js
