name: Desktop app (Windows)

# Builds the Predict 360 desktop app and stores the downloadable .exe:
# - on every run: as a workflow artifact (download from the Actions run page)
# - on a version tag (e.g. v0.1.0): also attached to a GitHub Release, which
#   gives a permanent public download link at /releases/latest.
#
# Run it from the Actions tab ("Run workflow"), or push a tag:
#   git tag v0.1.0 && git push origin v0.1.0

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build the portable .exe
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload the .exe as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: predict360-windows
          path: desktop/release/*.exe
          if-no-files-found: error

      - name: Attach the .exe to a GitHub Release (tagged builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/release/*.exe
