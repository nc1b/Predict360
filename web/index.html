<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Predict 360: a two-sentence morning check-in that compares your typing rhythm with your own usual. Prototype, not medical advice." />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>Predict 360</title>
    <script>
      try {
        var t = localStorage.getItem('p360.theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
